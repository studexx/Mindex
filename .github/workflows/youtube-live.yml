name: YouTube Live Reservation

on:
  schedule:
    # Sunday 00:00 UTC+9
    - cron: "0 15 * * 6"
    # Sunday 08:00 UTC+9
    - cron: "0 23 * * 6"
  workflow_dispatch:
    inputs:
      date:
        description: "Service date as YYYY-MM-DD. Leave empty to use today in UTC+9."
        required: false
        type: string
      dry_run:
        description: "Resolve and print the plan without creating a YouTube live reservation."
        required: false
        default: true
        type: boolean

jobs:
  reserve-youtube-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
      YOUTUBE_LIVE_STREAM_ID: ${{ secrets.YOUTUBE_LIVE_STREAM_ID }}
      YOUTUBE_LIVE_PLAYLIST_ID: ${{ secrets.YOUTUBE_LIVE_PLAYLIST_ID }}
      YOUTUBE_LIVE_THUMBNAIL_PATH: assets/youtube_live_thumbnail.jpg
      YOUTUBE_LIVE_THUMBNAIL_B64: ${{ secrets.YOUTUBE_LIVE_THUMBNAIL_B64 }}
      YOUTUBE_LIVE_THUMBNAIL_EXT: ${{ vars.YOUTUBE_LIVE_THUMBNAIL_EXT || '.jpg' }}
      YOUTUBE_LIVE_PLAYLIST_TITLE_TEMPLATE: ${{ vars.YOUTUBE_LIVE_PLAYLIST_TITLE_TEMPLATE || '주일예배 LIVE {year}' }}
      YOUTUBE_LIVE_PRIVACY_STATUS: ${{ vars.YOUTUBE_LIVE_PRIVACY_STATUS || 'public' }}
      YOUTUBE_LIVE_DURATION_MINUTES: ${{ vars.YOUTUBE_LIVE_DURATION_MINUTES || '90' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube dependencies
        run: python -m pip install -r requirements-youtube-live.txt

      - name: Get UTC+9 service date
        id: kst-date
        run: echo "date=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore retry marker
        id: retry-cache
        uses: actions/cache/restore@v4
        with:
          path: output/youtube-live-source
          key: youtube-live-source-${{ steps.kst-date.outputs.date }}

      - name: Build command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          args=(--today --require-ready)

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.date }}" ]]; then
            args=(--date "${{ inputs.date }}" --require-ready)
          elif [[ "${{ github.event.schedule }}" == "0 15 * * 6" ]]; then
            args+=(--mark-retry-if-not-ready)
          elif [[ "${{ github.event.schedule }}" == "0 23 * * 6" ]]; then
            args+=(--retry-only-if-marked)
          fi

          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.dry_run }}" != "true" ]]; then
            args+=(--apply)
          fi

          printf 'args<<EOF\n' >> "$GITHUB_OUTPUT"
          printf '%q ' "${args[@]}" >> "$GITHUB_OUTPUT"
          printf '\nEOF\n' >> "$GITHUB_OUTPUT"

      - name: Create YouTube live reservation
        shell: bash
        run: |
          set +e
          python scripts/youtube_live_schedule.py ${{ steps.command.outputs.args }}
          code=$?
          if [[ "$code" == "2" ]]; then
            echo "Mindex source was not ready; leaving this run green."
            exit 0
          fi
          exit "$code"

      - name: Ensure retry marker directory exists
        if: always() && steps.retry-cache.outputs.cache-hit != 'true'
        run: mkdir -p output/youtube-live-source

      - name: Save retry marker
        if: always() && steps.retry-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: output/youtube-live-source
          key: youtube-live-source-${{ steps.kst-date.outputs.date }}
