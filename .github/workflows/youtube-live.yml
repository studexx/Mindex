name: YouTube Live Reservation

on:
  schedule:
    # Monday 00:00 UTC+9, after Sunday has passed.
    - cron: "0 15 * * 0"
  workflow_dispatch:
    inputs:
      date:
        description: "Service date as YYYY-MM-DD. Leave empty to use the next Sunday in UTC+9."
        required: false
        type: string
      dry_run:
        description: "Print the plan without creating a YouTube live reservation."
        required: false
        default: true
        type: boolean

jobs:
  reserve-youtube-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      YOUTUBE_TOKEN_JSON_B64: ${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}
      YOUTUBE_LIVE_STREAM_ID: ${{ secrets.YOUTUBE_LIVE_STREAM_ID }}
      YOUTUBE_LIVE_PLAYLIST_ID: ${{ secrets.YOUTUBE_LIVE_PLAYLIST_ID }}
      YOUTUBE_LIVE_PLAYLIST_TITLE_TEMPLATE: ${{ vars.YOUTUBE_LIVE_PLAYLIST_TITLE_TEMPLATE || '주일예배 LIVE {year}' }}
      YOUTUBE_LIVE_PRIVACY_STATUS: ${{ vars.YOUTUBE_LIVE_PRIVACY_STATUS || 'public' }}
      YOUTUBE_LIVE_DURATION_MINUTES: ${{ vars.YOUTUBE_LIVE_DURATION_MINUTES || '90' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YouTube dependencies
        run: python -m pip install -r requirements-youtube-live.txt

      - name: Build command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          args=()

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.date }}" ]]; then
            args=(--date "${{ inputs.date }}")
          fi

          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.dry_run }}" != "true" ]]; then
            args+=(--apply)
          fi

          printf 'args<<EOF\n' >> "$GITHUB_OUTPUT"
          printf '%q ' "${args[@]}" >> "$GITHUB_OUTPUT"
          printf '\nEOF\n' >> "$GITHUB_OUTPUT"

      - name: Create YouTube live reservation
        run: python scripts/youtube_live_schedule.py ${{ steps.command.outputs.args }}
