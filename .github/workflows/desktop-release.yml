name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Upload installers to a GitHub Release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag to publish when publish_release is true"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-14
            platform: mac
            arch: arm64
            target: dmg
          - label: macOS x64
            os: macos-13
            platform: mac
            arch: x64
            target: dmg
          - label: Windows x64
            os: windows-latest
            platform: win
            arch: x64
            target: nsis

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package weight
        run: pnpm run package:audit

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check mindex.presenter.js

      - name: Validate Python smoke syntax
        run: python -m py_compile tests/smoke_app.py tests/smoke_worship_presenter.py

      - name: Clean local dist
        run: pnpm run dist:clean

      - name: Build macOS installer
        if: matrix.platform == 'mac'
        run: pnpm exec electron-builder --mac ${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build Windows installer
        if: matrix.platform == 'win'
        run: pnpm exec electron-builder --win ${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Remove unpacked intermediates
        run: pnpm run dist:prune

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindex-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.exe

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: false

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.release_tag }}" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag is required when publishing from workflow_dispatch" >&2
            exit 1
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Mindex ${tag}" --notes "Mindex desktop release ${tag}"
          fi
          mkdir -p release-upload
          while IFS= read -r -d '' file; do
            artifact="$(basename "$(dirname "$file")")"
            cp "$file" "release-upload/${artifact}-$(basename "$file")"
          done < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.exe' \) -print0)
          find release-upload -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 \
            | xargs -0 gh release upload "$tag" --clobber
