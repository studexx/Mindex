<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindex</title>
    <link rel="stylesheet" href="./styles.css?v=mindex-hymn-list-1" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark">M</div>
          <div>
            <h1>Mindex</h1>
            <p>Ministry Index</p>
          </div>
        </div>

        <div class="topbar-actions">
          <span id="connectionStatus" class="status-pill">Disconnected</span>
          <button id="themeBtn" class="icon-btn" type="button" title="Toggle dark mode">
            <i data-lucide="moon"></i>
          </button>
          <button id="newSongBtn" class="btn secondary" type="button" title="New song">
            <i data-lucide="plus"></i>
            <span>New</span>
          </button>
          <button id="saveAllBtn" class="icon-btn primary" type="button" title="Save song" aria-label="Save song" disabled>
            <i data-lucide="save"></i>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" aria-label="Song list">
          <div class="search-wrap">
            <i data-lucide="search"></i>
            <input id="searchInput" type="search" placeholder="Search title, lyrics, #..." autocomplete="off" />
          </div>
          <div id="songCount" class="sidebar-count">0 songs</div>
          <div id="songList" class="song-list" tabindex="0"></div>
        </aside>

        <section id="detailPane" class="detail-pane" aria-live="polite"></section>
      </main>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js?v=mindex-hymn-list-1"></script>
  </body>
</html>
