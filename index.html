<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MINDEX</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#10231f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MINDEX" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="./styles.css?v=mindex-service-47" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1 class="brand-name">MINDE<span class="brand-accent">X</span></h1>
        <div class="search-wrap global-search-wrap">
          <i data-lucide="search"></i>
          <input id="searchInput" type="search" placeholder="Search title, lyrics, #..." autocomplete="off" />
        </div>
        <div class="topbar-actions">
          <button id="themeBtn" class="icon-btn" type="button" title="Toggle dark mode">
            <i data-lucide="moon"></i>
          </button>
          <button id="newSongBtn" class="btn secondary" type="button" title="New song">
            <i data-lucide="plus"></i>
            <span>New</span>
          </button>
          <button id="saveAllBtn" class="icon-btn primary" type="button" title="Save song" aria-label="Save song" disabled>
            <i data-lucide="save"></i>
          </button>
          <span id="connectionStatus" class="status-icon" title="Disconnected" hidden></span>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" aria-label="Mindex list">
          <nav id="moduleSwitcher" class="module-switcher" aria-label="Mindex modules">
            <button class="module-tab active" type="button" data-module="praise">Praise</button>
            <button class="module-tab" type="button" data-module="scripture">Scripture</button>
            <button class="module-tab" type="button" data-module="service">Service</button>
          </nav>
          <div id="listFilter" class="list-filter" aria-label="List filter">
            <button class="filter-tab active" type="button" data-list-filter="all">All</button>
            <button class="filter-tab" type="button" data-list-filter="hymns">Hymns</button>
            <button class="filter-tab" type="button" data-list-filter="ccm">CCM</button>
            <button class="filter-tab" type="button" data-list-filter="calendar" hidden>교회력</button>
          </div>
          <div id="songCount" class="sidebar-count">0 songs</div>
          <div id="songList" class="song-list" tabindex="0"></div>
        </aside>

        <section id="detailPane" class="detail-pane" aria-live="polite"></section>
      </main>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="./vendor/supabase-js.min.js"></script>
    <script src="./app.js?v=mindex-service-47"></script>
  </body>
</html>
