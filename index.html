  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-cluster">
          <button id="sidebarToggleBtn" class="top-left-tool" type="button" aria-label="Toggle sidebar">
            <i data-lucide="panel-left"></i>
          </button>
          <button id="brandHome" class="brand-home" type="button" aria-label="Go to Mindex home">
            <i data-lucide="home"></i>
          </button>
          <button id="brandNameHome" class="brand-name" type="button" aria-label="Go to Mindex home">MINDE<span class="brand-accent">X</span></button>
        </div>
        <nav class="primary-switcher" aria-label="Mindex areas">
          <button class="top-module-entry presenter-entry module-tab module-tab--primary" type="button" data-module="service" aria-label="Open worship tools">
            <i data-lucide="screen-share"></i>
            <span>Worship</span>
          </button>
          <button class="top-module-entry activities-entry module-tab module-tab--secondary" type="button" data-module="activities" aria-label="Open activities">
            <i data-lucide="trophy"></i>
            <span>Activities</span>
          </button>
          <button class="top-module-entry praise-entry module-tab module-tab--secondary" type="button" data-module="praise" aria-label="Open praise">
            <i data-lucide="music-2"></i>
            <span>Praise</span>
          </button>
          <button class="top-module-entry scripture-entry module-tab module-tab--secondary" type="button" data-module="scripture" aria-label="Open scripture">
            <i data-lucide="book-open"></i>
            <span>Scripture</span>
          </button>
        </nav>
        <div class="topbar-actions">
          <button id="themeBtn" class="icon-btn" type="button">
            <i data-lucide="moon"></i>
          </button>
          <button id="newSongBtn" class="btn secondary" type="button">
            <i data-lucide="plus"></i>
            <span>New</span>
          </button>
          <button id="saveAllBtn" class="icon-btn primary" type="button" aria-label="Save song" disabled>
            <i data-lucide="save"></i>
          </button>
          <span id="connectionStatus" class="status-icon" hidden></span>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" aria-label="Mindex list">
          <div class="search-wrap global-search-wrap sidebar-search-wrap">
            <i data-lucide="search"></i>
            <input id="searchInput" type="search" placeholder="Search..." autocomplete="off" />
          </div>
          <div id="listFilter" class="list-filter" aria-label="List filter">
            <button class="filter-tab active" type="button" data-list-filter="all">All</button>
            <button class="filter-tab" type="button" data-list-filter="hymns">Hymns</button>
            <button class="filter-tab" type="button" data-list-filter="ccm">CCM</button>
            <button class="filter-tab" type="button" data-list-filter="children" hidden>Kids</button>
          </div>
          <div id="songCount" class="sidebar-count">0 songs</div>
          <div id="songList" class="song-list" tabindex="0"></div>
        </aside>

        <section id="detailPane" class="detail-pane" aria-live="polite"></section>
      </main>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>
